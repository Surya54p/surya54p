<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 255" width="100%" height="100%">
  <defs>
    <!-- Soft Glow & Depth Shadow -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .code-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13.5px;
      line-height: 23px;
    }
    .bracket { fill: #f0f6fc; }
    .key { fill: #7ee787; font-weight: 500; }
    .str { fill: #a5d6ff; }
    .punct { fill: #8b949e; }
    .title-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      fill: #8b949e;
      font-weight: 500;
    }
  </style>

  <!-- Main Terminal Window Frame -->
  <g filter="url(#winShadow)">
    <!-- Window Body Background -->
    <rect x="10" y="8" width="860" height="236" rx="10" fill="#090d16" stroke="#21262d" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M 10 18 Q 10 8 20 8 L 860 8 Q 870 8 870 18 L 870 42 L 10 42 Z" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <line x1="10" y1="42" x2="870" y2="42" stroke="#21262d" stroke-width="1" />

    <!-- macOS Traffic Light Control Dots -->
    <circle cx="28" cy="25" r="5.5" fill="#ff5f56" />
    <circle cx="45" cy="25" r="5.5" fill="#ffbd2e" />
    <circle cx="62" cy="25" r="5.5" fill="#27c93f" />

    <!-- File Title in Header -->
    <text x="82" y="29" class="title-text">surya.config.json</text>

    <!-- Language Badge (Right Side) -->
    <rect x="806" y="17" width="50" height="16" rx="4" fill="#21262d" />
    <text x="831" y="29" class="title-text" text-anchor="middle" font-size="10.5" fill="#7ee787">JSON</text>
  </g>

  <!-- JSON Code Body -->
  <g class="code-text" xml:space="preserve">
    <!-- Line 1: { -->
    <text x="32" y="70"><tspan class="bracket">{</tspan></text>

    <!-- Line 2:   "engineering_dna": { -->
    <text x="32" y="93"><tspan class="punct">  </tspan><tspan class="key">"engineering_dna"</tspan><tspan class="punct">: </tspan><tspan class="bracket">{</tspan></text>

    <!-- Line 3:     "architecture": "Spec-Driven Development (SDD)", -->
    <text x="32" y="116"><tspan class="punct">    </tspan><tspan class="key">"architecture"</tspan><tspan class="punct">: </tspan><tspan class="str">"Spec-Driven Development (SDD)"</tspan><tspan class="punct">,</tspan></text>

    <!-- Line 4:     "data_integrity": "Zero-Fallback Policy", -->
    <text x="32" y="139"><tspan class="punct">    </tspan><tspan class="key">"data_integrity"</tspan><tspan class="punct">: </tspan><tspan class="str">"Zero-Fallback Policy"</tspan><tspan class="punct">,</tspan></text>

    <!-- Line 5:     "craftsmanship": "Clean, readable &amp; maintainable code", -->
    <text x="32" y="162"><tspan class="punct">    </tspan><tspan class="key">"craftsmanship"</tspan><tspan class="punct">: </tspan><tspan class="str">"Clean, readable &amp; maintainable code"</tspan><tspan class="punct">,</tspan></text>

    <!-- Line 6:     "ownership": "End-to-end accountability from design to production" -->
    <text x="32" y="185"><tspan class="punct">    </tspan><tspan class="key">"ownership"</tspan><tspan class="punct">: </tspan><tspan class="str">"End-to-end accountability from design to production"</tspan></text>

    <!-- Line 7:   } -->
    <text x="32" y="208"><tspan class="punct">  </tspan><tspan class="bracket">}</tspan></text>

    <!-- Line 8: } -->
    <text x="32" y="231"><tspan class="bracket">}</tspan></text>
  </g>
</svg>