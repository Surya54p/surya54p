<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="100%" height="100%">
  <defs>
    <!-- Soft Glow & Depth Shadow -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Main Terminal Window Frame -->
  <g filter="url(#winShadow)">
    <!-- Window Body Background -->
    <rect x="10" y="8" width="860" height="244" rx="10" fill="#090d16" stroke="#21262d" stroke-width="1" />
    
    <!-- Window Header -->
    <path d="M 10 18 Q 10 8 20 8 L 860 8 Q 870 8 870 18 L 870 42 L 10 42 Z" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <line x1="10" y1="42" x2="870" y2="42" stroke="#21262d" stroke-width="1" />

    <!-- macOS Traffic Light Control Dots -->
    <circle cx="28" cy="25" r="5.5" fill="#ff5f56" />
    <circle cx="45" cy="25" r="5.5" fill="#ffbd2e" />
    <circle cx="62" cy="25" r="5.5" fill="#27c93f" />

    <!-- File Title in Header (Centered) -->
    <text x="440" y="25" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8b949e" font-weight="500">surya.config.json</text>

    <!-- Language Badge (Right Side) -->
    <rect x="806" y="17" width="50" height="16" rx="4" fill="#21262d" />
    <text x="831" y="25" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#7ee787" font-weight="600">JSON</text>
  </g>

  <!-- JSON Code Body with explicit indentation coordinates -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">
    <!-- Line 1: { -->
    <text x="36" y="72" fill="#f0f6fc">{</text>

    <!-- Line 2:   "engineering_dna": { -->
    <text x="56" y="96">
      <tspan fill="#7ee787" font-weight="500">"engineering_dna"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#f0f6fc">{</tspan>
    </text>

    <!-- Line 3:     "architecture": "Spec-Driven Development (SDD)", -->
    <text x="76" y="120">
      <tspan fill="#7ee787" font-weight="500">"architecture"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#38bdf8">"Spec-Driven Development (SDD)"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <!-- Line 4:     "data_integrity": "Zero-Fallback Policy", -->
    <text x="76" y="144">
      <tspan fill="#7ee787" font-weight="500">"data_integrity"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#38bdf8">"Zero-Fallback Policy"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <!-- Line 5:     "craftsmanship": "Clean, readable & maintainable code", -->
    <text x="76" y="168">
      <tspan fill="#7ee787" font-weight="500">"craftsmanship"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#38bdf8">"Clean, readable &amp; maintainable code"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <!-- Line 6:     "ownership": "End-to-end accountability from design to production" -->
    <text x="76" y="192">
      <tspan fill="#7ee787" font-weight="500">"ownership"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#38bdf8">"End-to-end accountability from design to production"</tspan>
    </text>

    <!-- Line 7:   } -->
    <text x="56" y="216" fill="#f0f6fc">}</text>

    <!-- Line 8: } -->
    <text x="36" y="240" fill="#f0f6fc">}</text>
  </g>
</svg>