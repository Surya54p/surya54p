<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 150" width="100%" height="100%">
  <defs>
    <!-- Deep Space Void Gradient -->
    <radialGradient id="footerVoid" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#04060d" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- Ambient Cyan / Purple Cosmic Glow -->
    <radialGradient id="footerNebula" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shooting Star Gradient: Head (White) -> Trail (Cyan) -> Faded Tail -->
    <linearGradient id="meteorTailGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="meteorTailGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter for Meteor Head -->
    <filter id="headGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.7" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    /* Shooting Star Animations */
    @keyframes shootingStar1 {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      30% {
        transform: translate(-380px, 150px);
        opacity: 0;
      }
      100% {
        transform: translate(-380px, 150px);
        opacity: 0;
      }
    }

    @keyframes shootingStar2 {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      35% {
        transform: translate(-420px, 160px);
        opacity: 0;
      }
      100% {
        transform: translate(-420px, 160px);
        opacity: 0;
      }
    }

    @keyframes shootingStar3 {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }
      6% {
        opacity: 1;
      }
      28% {
        transform: translate(-320px, 130px);
        opacity: 0;
      }
      100% {
        transform: translate(-320px, 130px);
        opacity: 0;
      }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }

    .star-twinkle {
      animation: twinkle 3.5s ease-in-out infinite;
    }

    .meteor-1 {
      animation: shootingStar1 4.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }

    .meteor-2 {
      animation: shootingStar2 7.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 2.4s;
    }

    .meteor-3 {
      animation: shootingStar3 6.0s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 4.0s;
    }

    .font-code {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }
  </style>

  <!-- BACKGROUND -->
  <rect width="1100" height="150" rx="14" fill="url(#footerVoid)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="1100" height="150" rx="14" fill="url(#footerNebula)" />

  <!-- BACKGROUND STARFIELD -->
  <g id="starfield">
