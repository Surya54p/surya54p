  <!-- SHOOTING STARS / METEORS (Bintang Jatuh) -->
  
  <!-- Meteor 1 (Cyan / Central) -->
  <g transform="translate(780, -20)" class="meteor-1">
    <!-- Tail Trail (Angled 22 degrees downward-left) -->
    <line x1="0" y1="0" x2="160" y2="-62" stroke="url(#meteorTailGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="80" y2="-31" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <!-- Bright Meteor Head -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#headGlow)" />
  </g>

  <!-- Meteor 2 (Purple/Indigo / Left Sky) -->
  <g transform="translate(380, -30)" class="meteor-2">
    <line x1="0" y1="0" x2="180" y2="-68" stroke="url(#meteorTailGrad2)" stroke-width="2.4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="90" y2="-34" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <circle cx="0" cy="0" r="2.8" fill="#ffffff" filter="url(#headGlow)" />
  </g>

  <!-- Meteor 3 (Fast Swift Shooting Star / Right Sky) -->
  <g transform="translate(1080, 10)" class="meteor-3">
    <line x1="0" y1="0" x2="140" y2="-55" stroke="url(#meteorTailGrad)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" filter="url(#headGlow)" />
  </g>

  <!-- SILHOUETTE HORIZON CURVE AT BOTTOM -->
  <path d="M 0 150 Q 550.0 122 1100 150 Z" fill="#03060d" opacity="0.75" />
  <path d="M 0 150 Q 550.0 122 1100 150" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.25" stroke-dasharray="6 8" />

  <!-- CENTER LOGO / SIGN-OFF -->
  <g transform="translate(550.0, 102)" text-anchor="middle" filter="url(#textGlow)">
    <text y="0" fill="#94a3b8" class="font-code" font-size="12" font-weight="600" letter-spacing="2">
      ✦ SURYA AP // KEEP EXPLORING, KEEP BUILDING ✦
    </text>
    <text y="22" fill="#475569" class="font-code" font-size="10.5" letter-spacing="1">
      &gt; system.status = STANDBY --until-next-orbit
    </text>
  </g>
